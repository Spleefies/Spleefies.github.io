<!DOCTYPE html>
<head>
    <title>Spleefies</title>
    <style>
        :root{color-scheme: light dark;}
        div{
            display: inline-block;
            text-align: center
        }
        .button{
            border-radius: 16px;
            padding: 20px;
            border: 3px solid #fff;
            transition: border-color 0.2s ease;
        }
        .button:hover {border-color: light-dark(green,#7CFC00)}
        a{
            font-size: 2rem;
            color: light-dark(#000,#fff);
            text-decoration: none;
        }
        .logo {float: right;}
        body {
            background-color: light-dark(#fff,#000);
            color: light-dark(#000,#fff);
        }
        img{height: 6em;}
        @media (prefers-color-scheme: dark) {
            .button{
                border-radius: 16px;
                padding: 20px;
                border: 3px solid #000;
                transition: border-color 0.2s ease;
            }
            img{filter:invert(1)}
        }
    </style>
</head>
<body>
    <div style="font-size:7rem;">Welcome!</div><br>
    <div class="button">
        <a href="v1/">
            Random <br>Projects
        </a>
    </div>
    <div class="button">
        <a href="https://spleefies.github.io/countdown">
            <img src="timer.svg"><br>
            Countdown
        </a>
    </div>
</body>
